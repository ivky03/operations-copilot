# Local development stack. Run: docker compose up -d
# Data persists in named volumes across restarts. `docker compose down -v` deletes it.
name: opscopilot

services:
  postgres:
    # Postgres 16 with the pgvector extension preinstalled. pg_trgm ships with Postgres contrib.
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
    ports:
      # Host port 5433 by default, so it can run alongside other local Postgres instances.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"   # loopback only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  floci:
    # Local AWS emulator. We use only S3 and SQS.
    # Pinned to a release more than two weeks old. Bump deliberately.
    image: floci/floci:2.4.0
    environment:
      FLOCI_STORAGE_MODE: persistent             # flush every write to disk; survives restarts
      FLOCI_STORAGE_PERSISTENT_PATH: /var/lib/floci
      FLOCI_SERVICES_UI_ENABLED: "false"         # the console sidecar needs the Docker socket; not needed
    # Deliberately NOT mounting /var/run/docker.sock. That would grant the container
    # control of the host's Docker engine. It's only needed for Lambda/ECS, which we don't use.
    ports:
      - "127.0.0.1:${FLOCI_HOST_PORT:-4566}:4566"
    volumes:
      - flocidata:/var/lib/floci

volumes:
  pgdata:
  flocidata:
