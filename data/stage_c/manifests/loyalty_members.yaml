# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: loyalty_members
title: Loyalty programme members
description: 'Members of the Brindlewood Rewards programme, their tier and current points balance (as
  of 30 April 2026). Tier follows the balance: Gold 1,500+, Silver 600+, otherwise Bronze.'
grain: One row per member.
primary_key:
- member_id
time_column: joined_date
columns:
- name: member_id
  type: string
  role: id
  description: Membership number.
- name: customer_id
  type: string
  role: id
  description: The member's customer record.
- name: tier
  type: string
  role: dimension
  description: Bronze, Silver or Gold.
  value_index: true
  allowed_values:
  - Bronze
  - Silver
  - Gold
- name: joined_date
  type: date
  role: time
  description: When the customer joined the programme.
- name: points_balance
  type: integer
  role: measure
  description: Points held on 30 April 2026.
- name: status
  type: string
  role: dimension
  description: active, or lapsed (no points).
  value_index: true
  allowed_values:
  - active
  - lapsed
relationships:
- column: customer_id
  references: customers.customer_id
metrics:
- name: member_count
  title: Loyalty members
  description: Programme members.
  aggregation: count
  expression: member_id
- name: points_outstanding
  title: Points outstanding
  description: Points members hold and could still redeem.
  aggregation: sum
  expression: points_balance
