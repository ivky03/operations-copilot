# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: store_incidents
title: Store incidents
description: 'Safety and security incidents in physical stores: what happened, how serious, injuries,
  and the value of goods lost.'
grain: One row per incident.
primary_key:
- incident_id
time_column: incident_date
columns:
- name: incident_id
  type: string
  role: id
  description: Incident.
- name: store_id
  type: string
  role: id
  description: Store.
- name: incident_date
  type: date
  role: time
  description: When it happened.
- name: incident_type
  type: string
  role: dimension
  description: What happened.
  value_index: true
  allowed_values:
  - slip or fall
  - theft
  - damaged stock
  - fire alarm
  - aggressive customer
- name: severity
  type: string
  role: dimension
  description: low, medium or high.
  value_index: true
  allowed_values:
  - low
  - medium
  - high
- name: injuries
  type: integer
  role: measure
  description: People hurt.
- name: loss_value
  type: decimal
  role: measure
  description: Goods lost or damaged, EUR.
  unit: EUR
- name: reported_by
  type: string
  role: id
  description: Employee who reported it.
  nullable: true
relationships:
- column: store_id
  references: stores.store_id
- column: reported_by
  references: staff.employee_id
metrics:
- name: incident_count
  title: Incidents
  description: Store incidents.
  aggregation: count
  expression: incident_id
- name: injuries
  title: Injuries
  description: People injured.
  aggregation: sum
  expression: injuries
- name: incident_loss_value
  title: Incident losses
  description: Goods lost or damaged in incidents.
  aggregation: sum
  expression: loss_value
  unit: EUR
