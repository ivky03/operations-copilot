# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: expenses
title: Employee expense claims
description: 'Expenses employees paid themselves and claimed back: category, amount, approval and reimbursement.
  Marketing claims here are small local costs; media spend on campaigns is in campaign spend.'
grain: One row per claim.
primary_key:
- expense_id
time_column: expense_date
columns:
- name: expense_id
  type: string
  role: id
  description: Claim.
- name: employee_id
  type: string
  role: id
  description: Employee.
- name: store_id
  type: string
  role: id
  description: Store charged. Empty for head-office staff.
  nullable: true
- name: expense_date
  type: date
  role: time
  description: Date of the expense.
- name: category
  type: string
  role: dimension
  description: Kind of expense.
  value_index: true
  allowed_values:
  - travel
  - meals
  - store supplies
  - training
  - marketing
- name: amount
  type: decimal
  role: measure
  description: Amount claimed, EUR.
  unit: EUR
- name: approved
  type: boolean
  role: dimension
  description: Approved by the manager.
- name: reimbursed_date
  type: date
  role: dimension
  description: When paid back. Empty if not yet.
  nullable: true
relationships:
- column: employee_id
  references: staff.employee_id
- column: store_id
  references: stores.store_id
metrics:
- name: expense_claims
  title: Expense claims
  description: Claims made.
  aggregation: count
  expression: expense_id
- name: expenses_claimed
  title: Expenses claimed
  description: Amount claimed.
  aggregation: sum
  expression: amount
  unit: EUR
- name: expenses_approved
  title: Expenses approved
  description: Amount approved.
  aggregation: sum
  expression: amount
  unit: EUR
  filters:
  - column: approved
    op: '='
    value: true
