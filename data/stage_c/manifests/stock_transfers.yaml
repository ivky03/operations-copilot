# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: stock_transfers
title: Stock transfers to stores
description: 'Stock moved from a distribution centre to a store or web shop: requested, shipped and received
  dates.'
grain: One row per transfer.
primary_key:
- transfer_id
time_column: requested_date
columns:
- name: transfer_id
  type: string
  role: id
  description: Transfer.
- name: product_id
  type: string
  role: id
  description: Product.
- name: from_warehouse_id
  type: string
  role: id
  description: Sending warehouse.
- name: to_store_id
  type: string
  role: id
  description: Receiving store.
- name: requested_date
  type: date
  role: time
  description: When the store asked.
- name: shipped_date
  type: date
  role: dimension
  description: When it left the warehouse.
  nullable: true
- name: received_date
  type: date
  role: dimension
  description: When the store received it.
  nullable: true
- name: quantity
  type: integer
  role: measure
  description: Units.
- name: status
  type: string
  role: dimension
  description: requested, in transit or received.
  value_index: true
  allowed_values:
  - requested
  - in transit
  - received
relationships:
- column: product_id
  references: products.product_id
- column: from_warehouse_id
  references: warehouses.warehouse_id
- column: to_store_id
  references: stores.store_id
metrics:
- name: transfer_count
  title: Stock transfers
  description: Transfers requested.
  aggregation: count
  expression: transfer_id
- name: units_transferred
  title: Units transferred
  description: Units moved to stores.
  aggregation: sum
  expression: quantity
