# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: product_page_views
title: Product page views
description: How often each product page was viewed in the web shops, and how often the product was added
  to the basket, by day, device and traffic source.
grain: One row per web shop, day, product, device and traffic source.
primary_key:
- view_date
- store_id
- product_id
- device
- traffic_source
time_column: view_date
columns:
- name: view_date
  type: date
  role: time
  description: Day.
- name: store_id
  type: string
  role: id
  description: Web shop.
- name: product_id
  type: string
  role: id
  description: Product.
- name: device
  type: string
  role: dimension
  description: desktop, mobile or tablet.
  value_index: true
  allowed_values:
  - desktop
  - mobile
  - tablet
- name: traffic_source
  type: string
  role: dimension
  description: Where visitors came from.
  value_index: true
  allowed_values:
  - organic
  - paid
  - email
  - direct
- name: page_views
  type: integer
  role: measure
  description: Views of the product page.
- name: add_to_cart
  type: integer
  role: measure
  description: Times the product was added to the basket.
relationships:
- column: store_id
  references: stores.store_id
- column: product_id
  references: products.product_id
metrics:
- name: page_views
  title: Product page views
  description: Views of product pages.
  aggregation: sum
  expression: page_views
- name: add_to_cart
  title: Add to basket
  description: Times products were added to the basket.
  aggregation: sum
  expression: add_to_cart
