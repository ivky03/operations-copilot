# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: payroll
title: Payroll by month
description: 'Monthly pay for each employee: gross pay, overtime hours and pay, and employer costs (social
  charges). Finance only. Hours actually worked per shift are in shifts.'
grain: One row per employee per month.
primary_key:
- pay_month
- employee_id
time_column: pay_month
columns:
- name: pay_month
  type: date
  role: time
  description: First day of the month.
- name: employee_id
  type: string
  role: id
  description: Employee.
- name: store_id
  type: string
  role: id
  description: Store the employee works at. Empty for head-office staff (customer service).
  nullable: true
- name: gross_pay
  type: decimal
  role: measure
  description: Gross pay excluding overtime, EUR.
  unit: EUR
- name: overtime_hours
  type: decimal
  role: measure
  description: Overtime hours paid.
  unit: hours
- name: overtime_pay
  type: decimal
  role: measure
  description: Overtime pay, EUR.
  unit: EUR
- name: employer_costs
  type: decimal
  role: measure
  description: Employer social charges, EUR.
  unit: EUR
relationships:
- column: employee_id
  references: staff.employee_id
- column: store_id
  references: stores.store_id
metrics:
- name: gross_pay
  title: Gross pay
  description: Gross pay excluding overtime.
  aggregation: sum
  expression: gross_pay
  unit: EUR
- name: overtime_pay
  title: Overtime pay
  description: Overtime pay.
  aggregation: sum
  expression: overtime_pay
  unit: EUR
- name: overtime_hours
  title: Overtime hours
  description: Overtime hours paid.
  aggregation: sum
  expression: overtime_hours
- name: employer_costs
  title: Employer costs
  description: Employer social charges.
  aggregation: sum
  expression: employer_costs
  unit: EUR
derived_metrics:
- name: total_staff_cost
  title: Total staff cost
  description: Gross pay plus overtime pay plus employer costs.
  formula: gross_pay + overtime_pay + employer_costs
