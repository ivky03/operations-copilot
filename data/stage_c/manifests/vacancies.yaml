# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: vacancies
title: Job vacancies
description: Open roles being recruited for, applicants and when filled. A vacancy is a role not yet filled;
  people actually employed are in staff.
grain: One row per vacancy.
primary_key:
- vacancy_id
time_column: opened_date
columns:
- name: vacancy_id
  type: string
  role: id
  description: Vacancy.
- name: store_id
  type: string
  role: id
  description: Store.
- name: job_role
  type: string
  role: dimension
  description: Role being recruited.
  value_index: true
  allowed_values:
  - Sales Associate
  - Stockroom Assistant
  - Store Manager
  - Visual Merchandiser
- name: opened_date
  type: date
  role: time
  description: When advertised.
- name: filled_date
  type: date
  role: dimension
  description: When accepted by a candidate.
  nullable: true
- name: applicants
  type: integer
  role: measure
  description: Applications received.
- name: status
  type: string
  role: dimension
  description: open, filled or withdrawn.
  value_index: true
  allowed_values:
  - open
  - filled
  - withdrawn
- name: salary_band
  type: string
  role: dimension
  description: Pay band.
  value_index: true
  allowed_values:
  - B1
  - B3
relationships:
- column: store_id
  references: stores.store_id
metrics:
- name: vacancy_count
  title: Vacancies
  description: Vacancies opened.
  aggregation: count
  expression: vacancy_id
- name: open_vacancy_count
  title: Open vacancies
  description: Vacancies still being recruited.
  aggregation: count
  expression: vacancy_id
  filters:
  - column: status
    op: '='
    value: open
- name: applicants
  title: Applicants
  description: Applications received.
  aggregation: sum
  expression: applicants
