# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: nps_responses
title: Customer NPS survey responses
description: 'Net Promoter Score survey answers from customers after a purchase: "How likely are you to
  recommend us?" from 0 to 10. Promoters score 9-10, detractors 0-6. NPS is the percentage of promoters
  minus the percentage of detractors. Not the support CSAT rating, and not the staff survey.'
grain: One row per survey response.
primary_key:
- response_id
time_column: response_date
columns:
- name: response_id
  type: string
  role: id
  description: Response.
- name: response_date
  type: date
  role: time
  description: When the customer answered.
- name: store_id
  type: string
  role: id
  description: Store or web shop of the purchase.
- name: customer_id
  type: string
  role: id
  description: Customer, if known.
  nullable: true
- name: score
  type: integer
  role: measure
  description: Likelihood to recommend, 0-10.
- name: survey_channel
  type: string
  role: dimension
  description: email or in_store.
  value_index: true
  allowed_values:
  - email
  - in_store
- name: main_topic
  type: string
  role: dimension
  description: What the customer commented on most.
  value_index: true
  allowed_values:
  - Product quality
  - Staff
  - Delivery
  - Price
  - Store layout
  - Website
relationships:
- column: store_id
  references: stores.store_id
- column: customer_id
  references: customers.customer_id
metrics:
- name: nps_response_count
  title: NPS responses
  description: Survey responses.
  aggregation: count
  expression: response_id
- name: average_nps_score
  title: Average NPS score
  description: Average 0-10 score (not NPS itself).
  aggregation: avg
  expression: score
- name: promoter_count
  title: Promoters
  description: Responses scoring 9 or 10.
  aggregation: count
  expression: response_id
  filters:
  - column: score
    op: '>='
    value: 9
- name: detractor_count
  title: Detractors
  description: Responses scoring 0 to 6.
  aggregation: count
  expression: response_id
  filters:
  - column: score
    op: <=
    value: 6
derived_metrics:
- name: net_promoter_score
  title: Net Promoter Score
  description: Percentage of promoters minus percentage of detractors (as a fraction).
  formula: (promoter_count - detractor_count) / nps_response_count
