# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: marketing_campaigns
title: Marketing campaigns
description: 'Marketing campaigns: channel, dates, budget and objective. A campaign may push a promotion
  code; the promotion itself (discount and dates) is in promotions.'
grain: One row per campaign.
primary_key:
- campaign_id
time_column: start_date
columns:
- name: campaign_id
  type: string
  role: id
  description: Campaign.
- name: campaign_name
  type: string
  role: dimension
  description: Campaign name.
  value_index: true
- name: channel
  type: string
  role: dimension
  description: Marketing channel.
  value_index: true
  allowed_values:
  - email
  - social
  - search
  - display
- name: start_date
  type: date
  role: time
  description: First day.
- name: end_date
  type: date
  role: dimension
  description: Last day.
- name: budget
  type: decimal
  role: measure
  description: Planned media budget, EUR.
  unit: EUR
- name: objective
  type: string
  role: dimension
  description: Awareness, Acquisition, Retention or Promotion.
  value_index: true
  allowed_values:
  - Awareness
  - Acquisition
  - Retention
  - Promotion
- name: category
  type: string
  role: dimension
  description: Product category featured, if any.
  value_index: true
  nullable: true
- name: promo_code
  type: string
  role: id
  description: Promotion code pushed, if any.
  nullable: true
relationships:
- column: promo_code
  references: promotions.promo_code
metrics:
- name: campaign_count
  title: Campaigns
  description: Number of campaigns.
  aggregation: count
  expression: campaign_id
- name: campaign_budget
  title: Campaign budget
  description: Planned media budget.
  aggregation: sum
  expression: budget
  unit: EUR
