# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: site_searches
title: Web shop searches
description: What visitors typed into the web shop search box, how often, and whether any product was
  found. Searches with no results show demand for things we don't sell.
grain: One row per web shop, day and search term.
primary_key:
- search_date
- store_id
- search_term
time_column: search_date
columns:
- name: search_date
  type: date
  role: time
  description: Day.
- name: store_id
  type: string
  role: id
  description: Web shop.
- name: search_term
  type: string
  role: dimension
  description: What was searched for.
  value_index: true
- name: searches
  type: integer
  role: measure
  description: Number of searches.
- name: results_found
  type: boolean
  role: dimension
  description: Whether the search found any product.
- name: result_clicks
  type: integer
  role: measure
  description: Clicks on a search result.
relationships:
- column: store_id
  references: stores.store_id
metrics:
- name: searches
  title: Site searches
  description: Searches in the web shops.
  aggregation: sum
  expression: searches
- name: zero_result_searches
  title: Searches with no results
  description: Searches that found no product.
  aggregation: sum
  expression: searches
  filters:
  - column: results_found
    op: '='
    value: false
