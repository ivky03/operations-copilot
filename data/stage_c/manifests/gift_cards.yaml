# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: gift_cards
title: Gift cards
description: 'Gift cards sold in 2026. Selling a gift card is not a sale of goods: it is money held for
  the customer until the card is used, so gift cards are never part of net sales.'
grain: One row per gift card.
primary_key:
- card_id
time_column: issued_date
columns:
- name: card_id
  type: string
  role: id
  description: Card number.
- name: issued_date
  type: date
  role: time
  description: When the card was sold.
- name: store_id
  type: string
  role: id
  description: Store or web shop that sold it.
- name: initial_value
  type: decimal
  role: measure
  description: Value loaded at sale, EUR.
  unit: EUR
- name: balance
  type: decimal
  role: measure
  description: Unused value on 30 April 2026, EUR.
  unit: EUR
- name: status
  type: string
  role: dimension
  description: active or redeemed (balance used up).
  value_index: true
  allowed_values:
  - active
  - redeemed
relationships:
- column: store_id
  references: stores.store_id
metrics:
- name: gift_cards_sold
  title: Gift cards sold
  description: Cards sold.
  aggregation: count
  expression: card_id
- name: gift_card_value_sold
  title: Gift card value sold
  description: Value loaded onto cards sold (not revenue).
  aggregation: sum
  expression: initial_value
  unit: EUR
- name: gift_card_liability
  title: Gift card liability
  description: Unused balance still owed to card holders.
  aggregation: sum
  expression: balance
  unit: EUR
