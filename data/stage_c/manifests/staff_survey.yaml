# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: staff_survey
title: Staff engagement survey
description: 'Anonymous employee engagement survey, run in January and April: engagement from 1 to 5 and
  whether they''d recommend Brindlewood as an employer. About employees, not customers.'
grain: One row per anonymous response.
primary_key:
- response_id
time_column: survey_month
columns:
- name: response_id
  type: string
  role: id
  description: Response.
- name: survey_month
  type: date
  role: time
  description: Survey round (first day of month).
- name: store_id
  type: string
  role: id
  description: Store of the respondent. Empty for head office.
  nullable: true
- name: engagement_score
  type: integer
  role: measure
  description: Engagement, 1-5.
- name: would_recommend_employer
  type: boolean
  role: dimension
  description: Would recommend working here.
- name: main_topic
  type: string
  role: dimension
  description: What the comment was mostly about.
  value_index: true
  allowed_values:
  - Workload
  - Manager support
  - Pay
  - Training
  - Team
relationships:
- column: store_id
  references: stores.store_id
metrics:
- name: staff_survey_responses
  title: Staff survey responses
  description: Responses.
  aggregation: count
  expression: response_id
- name: average_engagement
  title: Average engagement
  description: Average engagement score (1-5).
  aggregation: avg
  expression: engagement_score
