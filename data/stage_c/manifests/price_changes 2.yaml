# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: price_changes
title: Price changes
description: 'Changes to products'' shelf prices: old and new price, why, and who approved it. Prices
  actually charged on each sale (after promotions) are on transactions.'
grain: One row per price change.
primary_key:
- change_id
time_column: effective_date
columns:
- name: change_id
  type: string
  role: id
  description: Change.
- name: product_id
  type: string
  role: id
  description: Product.
- name: effective_date
  type: date
  role: time
  description: First day of the new price.
- name: old_price
  type: decimal
  role: attribute
  description: Price before, EUR.
- name: new_price
  type: decimal
  role: attribute
  description: Price after, EUR.
- name: reason
  type: string
  role: dimension
  description: cost increase, competitor price or clearance.
  value_index: true
  allowed_values:
  - cost increase
  - competitor price
  - clearance
- name: approved_by
  type: string
  role: dimension
  description: Category manager who approved it.
  value_index: true
relationships:
- column: product_id
  references: products.product_id
metrics:
- name: price_change_count
  title: Price changes
  description: Number of price changes.
  aggregation: count
  expression: change_id
