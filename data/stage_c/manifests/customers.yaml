# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: customers
title: Customers
description: 'Registered customers: where they signed up, their marketing consent and segment. Lifetime
  value is the CRM''s estimate over the customer''s whole history since sign-up, not 2026 sales; for sales
  use net sales from transactions.'
grain: One row per registered customer.
primary_key:
- customer_id
time_column: signup_date
columns:
- name: customer_id
  type: string
  role: id
  description: Customer identifier, as on transactions.
- name: country
  type: string
  role: dimension
  description: Country of the customer's home store.
  value_index: true
- name: signup_date
  type: date
  role: time
  description: When the customer registered.
- name: signup_channel
  type: string
  role: dimension
  description: 'Where they registered: store or online.'
  value_index: true
  allowed_values:
  - store
  - online
- name: marketing_opt_in
  type: boolean
  role: dimension
  description: Whether the customer agreed to marketing email.
- name: segment_code
  type: string
  role: id
  description: Marketing segment.
- name: home_store_id
  type: string
  role: id
  description: Store where the customer first bought.
- name: lifetime_value
  type: decimal
  role: measure
  description: CRM estimate of total spend since sign-up (all years), EUR.
  unit: EUR
relationships:
- column: segment_code
  references: customer_segments.segment_code
- column: home_store_id
  references: stores.store_id
metrics:
- name: customer_count
  title: Customers
  description: Registered customers.
  aggregation: count
  expression: customer_id
- name: opted_in_customer_count
  title: Customers opted in to marketing
  description: Registered customers who accept marketing email.
  aggregation: count
  expression: customer_id
  filters:
  - column: marketing_opt_in
    op: '='
    value: true
- name: average_lifetime_value
  title: Average customer lifetime value
  description: Average CRM lifetime value estimate (all years since sign-up).
  aggregation: avg
  expression: lifetime_value
  unit: EUR
