# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: web_sessions_daily
title: Web shop sessions by day
description: 'Web analytics for the three web shops: visits (sessions), visitors, bounces, orders and
  revenue as tracked in the browser. Online revenue here includes VAT and is counted when the order is
  placed, before cancellations and returns, so it does not match net sales. Use it for traffic and conversion,
  not for revenue.'
grain: One row per web shop, day, device and traffic source.
primary_key:
- session_date
- store_id
- device
- traffic_source
time_column: session_date
columns:
- name: session_date
  type: date
  role: time
  description: Day.
- name: store_id
  type: string
  role: id
  description: Web shop.
- name: device
  type: string
  role: dimension
  description: desktop, mobile or tablet.
  value_index: true
  allowed_values:
  - desktop
  - mobile
  - tablet
- name: traffic_source
  type: string
  role: dimension
  description: Where visitors came from.
  value_index: true
  allowed_values:
  - organic
  - paid
  - email
  - direct
- name: sessions
  type: integer
  role: measure
  description: Visits.
- name: users
  type: integer
  role: measure
  description: Distinct visitors that day (not additive across days).
- name: bounces
  type: integer
  role: measure
  description: Visits that left after one page.
- name: orders
  type: integer
  role: measure
  description: Orders placed in the browser.
- name: online_revenue
  type: decimal
  role: measure
  description: Browser-tracked order value incl. VAT, EUR (not net sales).
  unit: EUR
relationships:
- column: store_id
  references: stores.store_id
metrics:
- name: sessions
  title: Web sessions
  description: Visits to the web shops.
  aggregation: sum
  expression: sessions
- name: web_orders
  title: Web orders (analytics)
  description: Orders tracked by web analytics.
  aggregation: sum
  expression: orders
- name: bounces
  title: Bounces
  description: Single-page visits.
  aggregation: sum
  expression: bounces
- name: online_revenue
  title: Online revenue (analytics)
  description: Browser-tracked order value incl. VAT, before cancellations (not net sales).
  aggregation: sum
  expression: online_revenue
  unit: EUR
derived_metrics:
- name: conversion_rate
  title: Web conversion rate
  description: Web orders divided by sessions.
  formula: web_orders / sessions
- name: bounce_rate
  title: Bounce rate
  description: Bounces divided by sessions.
  formula: bounces / sessions
