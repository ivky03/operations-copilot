# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: supplier_invoices
title: Supplier invoices
description: 'Invoices from suppliers for purchase orders received: amount, due date and payment. Unpaid
  invoices past their due date are overdue.'
grain: One row per invoice.
primary_key:
- invoice_id
time_column: invoice_date
columns:
- name: invoice_id
  type: string
  role: id
  description: Supplier invoice.
- name: supplier_id
  type: string
  role: id
  description: Supplier.
- name: po_number
  type: string
  role: attribute
  description: Purchase order invoiced.
- name: invoice_date
  type: date
  role: time
  description: Invoice date.
- name: due_date
  type: date
  role: dimension
  description: Payment due.
- name: amount
  type: decimal
  role: measure
  description: Invoice amount, EUR.
  unit: EUR
- name: paid_date
  type: date
  role: dimension
  description: When paid. Empty if unpaid.
  nullable: true
- name: status
  type: string
  role: dimension
  description: paid, unpaid or disputed.
  value_index: true
  allowed_values:
  - paid
  - unpaid
  - disputed
relationships:
- column: supplier_id
  references: suppliers.supplier_id
metrics:
- name: invoiced_amount
  title: Supplier invoices
  description: Amount invoiced by suppliers.
  aggregation: sum
  expression: amount
  unit: EUR
- name: unpaid_invoice_amount
  title: Unpaid supplier invoices
  description: Amount not yet paid.
  aggregation: sum
  expression: amount
  unit: EUR
  filters:
  - column: status
    op: in
    value:
    - unpaid
    - disputed
- name: invoice_count
  title: Supplier invoice count
  description: Invoices received.
  aggregation: count
  expression: invoice_id
