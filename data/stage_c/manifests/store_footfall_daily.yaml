# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: store_footfall_daily
title: Store footfall by day
description: 'People entering each physical store per day, counted by door sensors. Footfall counts visitors,
  not customers or orders: most visitors buy nothing. Web shops have no footfall (see web sessions).'
grain: One row per physical store per day.
primary_key:
- footfall_date
- store_id
time_column: footfall_date
columns:
- name: footfall_date
  type: date
  role: time
  description: Day.
- name: store_id
  type: string
  role: id
  description: Physical store.
- name: visitors
  type: integer
  role: measure
  description: People who entered.
- name: peak_hour
  type: integer
  role: attribute
  description: Busiest hour (24-hour clock).
- name: weather
  type: string
  role: dimension
  description: Local weather that day.
  value_index: true
  allowed_values:
  - dry
  - rain
  - cold
  - warm
relationships:
- column: store_id
  references: stores.store_id
metrics:
- name: visitors
  title: Store visitors
  description: People entering physical stores (footfall).
  aggregation: sum
  expression: visitors
