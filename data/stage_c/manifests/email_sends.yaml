# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: email_sends
title: Email campaign sends
description: 'Marketing emails sent, by campaign and customer segment: how many were delivered, opened
  and clicked, and how many people unsubscribed.'
grain: One row per send per segment.
primary_key:
- send_id
time_column: send_date
columns:
- name: send_id
  type: string
  role: id
  description: Send.
- name: campaign_id
  type: string
  role: id
  description: Campaign.
- name: send_date
  type: date
  role: time
  description: When it was sent.
- name: segment_code
  type: string
  role: id
  description: Customer segment sent to.
- name: recipients
  type: integer
  role: measure
  description: Addresses sent to.
- name: delivered
  type: integer
  role: measure
  description: Emails delivered.
- name: opens
  type: integer
  role: measure
  description: Unique opens.
- name: clicks
  type: integer
  role: measure
  description: Unique clicks.
- name: unsubscribes
  type: integer
  role: measure
  description: People who unsubscribed.
relationships:
- column: campaign_id
  references: marketing_campaigns.campaign_id
- column: segment_code
  references: customer_segments.segment_code
metrics:
- name: emails_delivered
  title: Emails delivered
  description: Emails delivered.
  aggregation: sum
  expression: delivered
- name: email_opens
  title: Email opens
  description: Unique opens.
  aggregation: sum
  expression: opens
- name: email_clicks
  title: Email clicks
  description: Unique clicks.
  aggregation: sum
  expression: clicks
- name: unsubscribes
  title: Unsubscribes
  description: People who unsubscribed.
  aggregation: sum
  expression: unsubscribes
derived_metrics:
- name: email_open_rate
  title: Email open rate
  description: Opens divided by emails delivered.
  formula: email_opens / emails_delivered
