# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: gl_entries
title: General ledger
description: Monthly ledger postings by account and store, as booked by Finance at month end. Accounting
  sales revenue (account 4000) is recognised by posting date and excludes VAT; it is reconciled to net
  sales only after close and can differ from it. April is provisional until the month is closed.
grain: One row per account, store and month-end posting.
primary_key:
- entry_id
time_column: posting_date
columns:
- name: entry_id
  type: string
  role: id
  description: Posting.
- name: posting_date
  type: date
  role: time
  description: Date booked (month end).
- name: account_code
  type: string
  role: attribute
  description: Ledger account number.
- name: account_name
  type: string
  role: dimension
  description: Ledger account.
  value_index: true
  allowed_values:
  - Sales revenue
  - Gift card breakage
  - Cost of goods sold
  - Staff costs
  - Rent
  - Energy
  - Marketing
  - Repairs and maintenance
  - Delivery
- name: account_type
  type: string
  role: dimension
  description: Revenue, Cost of sales or Operating expense.
  value_index: true
  allowed_values:
  - Revenue
  - Cost of sales
  - Operating expense
- name: department
  type: string
  role: dimension
  description: Department charged.
  value_index: true
  allowed_values:
  - Commercial
  - Operations
  - Marketing
- name: store_id
  type: string
  role: id
  description: Store.
- name: amount
  type: decimal
  role: measure
  description: Amount booked, EUR (positive).
  unit: EUR
relationships:
- column: store_id
  references: stores.store_id
metrics:
- name: ledger_amount
  title: Ledger amount
  description: Amounts booked to ledger accounts.
  aggregation: sum
  expression: amount
  unit: EUR
- name: accounting_revenue
  title: Accounting revenue
  description: Ledger sales revenue (account 4000), by posting date; not net sales.
  aggregation: sum
  expression: amount
  unit: EUR
  filters:
  - column: account_code
    op: '='
    value: '4000'
- name: operating_expenses
  title: Operating expenses
  description: Ledger operating expenses.
  aggregation: sum
  expression: amount
  unit: EUR
  filters:
  - column: account_type
    op: '='
    value: Operating expense
