# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: return_inspections
title: Returned goods inspections
description: 'What happened to each returned item after inspection: grade A goes back on sale, grade B
  is sold at a discount, grade C is written off. The write-off value is the stock value lost, not the
  refund paid (refunds are in returns).'
grain: One row per inspected return.
primary_key:
- inspection_id
time_column: inspected_date
columns:
- name: inspection_id
  type: string
  role: id
  description: Inspection.
- name: return_id
  type: string
  role: id
  description: The return inspected.
- name: inspected_date
  type: date
  role: time
  description: When inspected.
- name: product_id
  type: string
  role: id
  description: Product.
- name: grade
  type: string
  role: dimension
  description: A (resell), B (discount) or C (write off).
  value_index: true
  allowed_values:
  - A
  - B
  - C
- name: restocked
  type: boolean
  role: dimension
  description: Put back into stock.
- name: write_off_value
  type: decimal
  role: measure
  description: Stock value lost, EUR.
  unit: EUR
relationships:
- column: return_id
  references: returns.return_id
- column: product_id
  references: products.product_id
metrics:
- name: inspection_count
  title: Inspections
  description: Returned items inspected.
  aggregation: count
  expression: inspection_id
- name: write_off_value
  title: Write-offs
  description: Stock value written off after returns.
  aggregation: sum
  expression: write_off_value
  unit: EUR
