# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: training_records
title: Staff training records
description: Mandatory and optional courses assigned to employees, due dates, completion and hours.
grain: One row per employee per course.
primary_key:
- record_id
time_column: due_date
columns:
- name: record_id
  type: string
  role: id
  description: Record.
- name: employee_id
  type: string
  role: id
  description: Employee.
- name: course
  type: string
  role: dimension
  description: Course.
  value_index: true
- name: course_category
  type: string
  role: dimension
  description: safety, systems, product, leadership or compliance.
  value_index: true
  allowed_values:
  - safety
  - systems
  - product
  - leadership
  - compliance
- name: due_date
  type: date
  role: time
  description: When it must be done.
- name: completed_date
  type: date
  role: dimension
  description: When completed. Empty if not.
  nullable: true
- name: course_hours
  type: decimal
  role: measure
  description: Length, hours.
  unit: hours
- name: status
  type: string
  role: dimension
  description: completed, overdue or assigned.
  value_index: true
  allowed_values:
  - completed
  - overdue
  - assigned
relationships:
- column: employee_id
  references: staff.employee_id
metrics:
- name: training_assigned
  title: Training assigned
  description: Courses assigned.
  aggregation: count
  expression: record_id
- name: training_completed
  title: Training completed
  description: Courses completed.
  aggregation: count
  expression: record_id
  filters:
  - column: status
    op: '='
    value: completed
- name: training_overdue
  title: Training overdue
  description: Courses past due and not done.
  aggregation: count
  expression: record_id
  filters:
  - column: status
    op: '='
    value: overdue
