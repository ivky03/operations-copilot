# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: loyalty_points
title: Loyalty points ledger
description: 'Every points movement: earned on purchases (one point per euro), redeemed (500 points for
  a voucher), and bonus points from campaigns. Redemptions are negative.'
grain: One row per points movement.
primary_key:
- entry_id
time_column: entry_date
columns:
- name: entry_id
  type: string
  role: id
  description: Ledger entry.
- name: member_id
  type: string
  role: id
  description: Member.
- name: entry_date
  type: date
  role: time
  description: Date of the movement.
- name: store_id
  type: string
  role: id
  description: Store, for purchases.
  nullable: true
- name: invoice_no
  type: string
  role: attribute
  description: Order that earned or used the points.
  nullable: true
- name: points
  type: integer
  role: measure
  description: Points added (positive) or used (negative).
- name: entry_type
  type: string
  role: dimension
  description: earn, redeem or bonus.
  value_index: true
  allowed_values:
  - earn
  - redeem
  - bonus
relationships:
- column: member_id
  references: loyalty_members.member_id
- column: store_id
  references: stores.store_id
metrics:
- name: points_earned
  title: Points earned
  description: Points earned on purchases and bonuses.
  aggregation: sum
  expression: points
  filters:
  - column: entry_type
    op: in
    value:
    - earn
    - bonus
- name: points_redeemed
  title: Points redeemed
  description: Points used for vouchers (shown as a negative number).
  aggregation: sum
  expression: points
  filters:
  - column: entry_type
    op: '='
    value: redeem
- name: redemption_count
  title: Redemptions
  description: Number of voucher redemptions.
  aggregation: count
  expression: entry_id
  filters:
  - column: entry_type
    op: '='
    value: redeem
