# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: maintenance_requests
title: Store maintenance requests
description: 'Repairs requested by stores: category, priority, contractor, cost once done, and whether
  still open. Cost is empty until the work is finished.'
grain: One row per request.
primary_key:
- request_id
time_column: opened_date
columns:
- name: request_id
  type: string
  role: id
  description: Request.
- name: store_id
  type: string
  role: id
  description: Store.
- name: opened_date
  type: date
  role: time
  description: When requested.
- name: closed_date
  type: date
  role: dimension
  description: When completed. Empty while open.
  nullable: true
- name: category
  type: string
  role: dimension
  description: Type of repair.
  value_index: true
  allowed_values:
  - HVAC
  - lighting
  - plumbing
  - IT
  - fixtures
  - doors and locks
- name: priority
  type: string
  role: dimension
  description: urgent, normal or low.
  value_index: true
  allowed_values:
  - urgent
  - normal
  - low
- name: contractor
  type: string
  role: dimension
  description: Contractor assigned.
  value_index: true
- name: cost
  type: decimal
  role: measure
  description: Final cost, EUR. Empty while open.
  unit: EUR
  nullable: true
- name: status
  type: string
  role: dimension
  description: open or closed.
  value_index: true
  allowed_values:
  - open
  - closed
relationships:
- column: store_id
  references: stores.store_id
metrics:
- name: maintenance_request_count
  title: Maintenance requests
  description: Repairs requested.
  aggregation: count
  expression: request_id
- name: open_maintenance_count
  title: Open maintenance requests
  description: Repairs not yet done.
  aggregation: count
  expression: request_id
  filters:
  - column: status
    op: '='
    value: open
- name: maintenance_cost
  title: Maintenance cost
  description: Cost of completed repairs.
  aggregation: sum
  expression: cost
  unit: EUR
