# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: campaign_spend_daily
title: Campaign spend and results by day
description: 'Daily media spend and ad-platform results per campaign. Attributed revenue is what the ad
  platforms credit to the campaign: campaigns overlap and it is measured before cancellations and returns,
  so it is NOT net sales and adding it up across campaigns over-counts.'
grain: One row per campaign per day.
primary_key:
- spend_date
- campaign_id
time_column: spend_date
columns:
- name: spend_date
  type: date
  role: time
  description: Day.
- name: campaign_id
  type: string
  role: id
  description: Campaign.
- name: impressions
  type: integer
  role: measure
  description: Times an ad was shown.
- name: clicks
  type: integer
  role: measure
  description: Clicks on ads.
- name: spend
  type: decimal
  role: measure
  description: Media spend that day, EUR.
  unit: EUR
- name: attributed_orders
  type: integer
  role: measure
  description: Orders the ad platform credits to the campaign.
- name: attributed_revenue
  type: decimal
  role: measure
  description: Revenue the ad platform credits to the campaign, EUR (not net sales).
  unit: EUR
relationships:
- column: campaign_id
  references: marketing_campaigns.campaign_id
metrics:
- name: media_spend
  title: Media spend
  description: Money spent on ads.
  aggregation: sum
  expression: spend
  unit: EUR
- name: impressions
  title: Impressions
  description: Ads shown.
  aggregation: sum
  expression: impressions
- name: ad_clicks
  title: Ad clicks
  description: Clicks on ads.
  aggregation: sum
  expression: clicks
- name: attributed_revenue
  title: Attributed revenue
  description: Revenue credited to campaigns by ad platforms (overlapping; not net sales).
  aggregation: sum
  expression: attributed_revenue
  unit: EUR
derived_metrics:
- name: click_through_rate
  title: Click-through rate
  description: Clicks divided by impressions.
  formula: ad_clicks / impressions
