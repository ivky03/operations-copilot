# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: store_audits
title: Store audits
description: Compliance audits of physical stores and their scores. 80% or more is a pass.
grain: One row per audit.
primary_key:
- audit_id
time_column: audit_date
columns:
- name: audit_id
  type: string
  role: id
  description: Audit.
- name: store_id
  type: string
  role: id
  description: Store.
- name: audit_date
  type: date
  role: time
  description: When audited.
- name: audit_type
  type: string
  role: dimension
  description: What was audited.
  value_index: true
  allowed_values:
  - health and safety
  - visual merchandising
  - cash handling
- name: score_pct
  type: decimal
  role: measure
  description: Score, percent.
- name: passed
  type: boolean
  role: dimension
  description: 80% or more.
- name: auditor
  type: string
  role: dimension
  description: Who audited.
  value_index: true
  allowed_values:
  - Area manager
  - External auditor
relationships:
- column: store_id
  references: stores.store_id
metrics:
- name: audit_count
  title: Audits
  description: Audits carried out.
  aggregation: count
  expression: audit_id
- name: average_audit_score
  title: Average audit score
  description: Average audit score, percent.
  aggregation: avg
  expression: score_pct
- name: failed_audit_count
  title: Failed audits
  description: Audits scoring under 80%.
  aggregation: count
  expression: audit_id
  filters:
  - column: passed
    op: '='
    value: false
