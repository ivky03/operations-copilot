# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: warehouse_stock
title: Warehouse stock by week
description: 'Units held in the distribution centres, counted every Monday. This is central warehouse
  stock only: stock in stores and web shops is in inventory snapshots. Point in time: never add it up
  across weeks.'
grain: One row per warehouse, product and Monday.
primary_key:
- snapshot_week
- warehouse_id
- product_id
time_column: snapshot_week
columns:
- name: snapshot_week
  type: date
  role: time
  description: Monday of the count.
- name: warehouse_id
  type: string
  role: id
  description: Warehouse.
- name: product_id
  type: string
  role: id
  description: Product.
- name: units_available
  type: integer
  role: measure
  description: Units in the warehouse.
- name: units_reserved
  type: integer
  role: measure
  description: Units already promised to stores.
- name: units_damaged
  type: integer
  role: measure
  description: Units damaged and unsellable.
relationships:
- column: warehouse_id
  references: warehouses.warehouse_id
- column: product_id
  references: products.product_id
metrics:
- name: warehouse_units_available
  title: Warehouse units available
  description: Units in distribution centres (point in time).
  aggregation: sum
  expression: units_available
- name: warehouse_units_reserved
  title: Warehouse units reserved
  description: Units promised to stores (point in time).
  aggregation: sum
  expression: units_reserved
