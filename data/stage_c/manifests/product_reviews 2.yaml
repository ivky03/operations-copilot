# Dataset manifest (Stage C). Synthetic. Generated by datagen/stage_c.py.
source: product_reviews
title: Product reviews
description: Star ratings and reviews customers left on the web shops (1 to 5 stars), and whether the
  reviewer bought the product.
grain: One row per review.
primary_key:
- review_id
time_column: review_date
columns:
- name: review_id
  type: string
  role: id
  description: Review.
- name: product_id
  type: string
  role: id
  description: Product.
- name: review_date
  type: date
  role: time
  description: When it was posted.
- name: store_id
  type: string
  role: id
  description: Web shop.
- name: rating
  type: integer
  role: measure
  description: Stars, 1-5.
- name: verified_purchase
  type: boolean
  role: dimension
  description: Whether the reviewer bought it.
- name: helpful_votes
  type: integer
  role: measure
  description: Other customers who found it helpful.
- name: topic
  type: string
  role: dimension
  description: Main subject of the review.
  value_index: true
  allowed_values:
  - Quality
  - Value
  - Delivery
  - Looks
  - Size
relationships:
- column: product_id
  references: products.product_id
- column: store_id
  references: stores.store_id
metrics:
- name: review_count
  title: Reviews
  description: Reviews posted.
  aggregation: count
  expression: review_id
- name: average_rating
  title: Average rating
  description: Average stars (1-5).
  aggregation: avg
  expression: rating
