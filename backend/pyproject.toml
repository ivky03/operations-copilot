[project]
name = "operations-copilot"
version = "0.1.0"
description = "Internal AI assistant over governed datasets and documents (synthetic data)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.123",
    "fastapi>=0.162.0",
    "fastembed>=0.7",
    "httpx>=0.28.1",
    "pgvector>=0.4",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# Supply-chain hygiene: never resolve packages published after this date.
# Bump deliberately when upgrading dependencies.
exclude-newer = "2026-11-01T00:00:00Z"
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as default arguments by design; these calls are safe there.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# Seeded randomness generates synthetic data; it is not used for anything security-related.
"datagen/**" = ["S311"]
# CSV fixtures must stay one row per line to remain readable as tables.
"tests/test_oracle.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs Postgres and Floci running (docker compose up)",
    "e2e: drives the built web app in a real browser (needs `npm run build` and Chrome)",
    "llm: calls the real language model (needs GROQ_API_KEY and RUN_LLM_TESTS=1; uses quota)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pandas>=3.1.0",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
