# Retrieval evaluation — Stage A documents.
#
# Each query lists the document sections that answer it, as "doc_id@vN#Heading". Labels were
# written by reading the documents, before looking at any search results.
#
# - relevant: []  means the persona must get NOTHING useful: the answer lives only in a
#   document they can't read. These are leak probes; they're excluded from recall/MRR.
# - history: true means the question is about an earlier policy, so superseded versions are
#   searched too. Without it, a superseded version in the results counts as a stale hit.
#
# Leaks are judged against data/reference/access.yaml, not against the search code's own
# permission logic, so a bug there can't hide itself.
version: 1
dataset: stage_a

queries:
  # ------------------------------------------------ golden-set policy questions (as asked)
  - id: r-001
    persona: operations
    query: How are order cancellations handled and recorded?
    relevant: ["cancellation-policy@v1#How cancellations are recorded", "cancellation-policy@v1#When customers can cancel"]
  - id: r-002
    persona: operations
    query: What is our return window?
    relevant: ["returns-refund-policy@v2#Return window"]
  - id: r-003
    persona: operations
    query: What was the return window before March 2026?
    history: true
    relevant: ["returns-refund-policy@v1#Return window"]
  - id: r-004
    persona: finance
    query: How is net sales defined?
    relevant: ["metric-definitions@v1#Net sales"]
  - id: r-005
    persona: operations
    query: Why do some transactions have no customer ID?
    relevant: ["data-quality-notes@v1#Missing customer IDs"]
  - id: r-006
    persona: operations
    query: When did we start selling in France?
    relevant: ["market-launches@v1#France web shop launch"]
  - id: r-007
    persona: operations
    query: How long does furniture delivery take?
    relevant: ["shipping-and-delivery@v1#Delivery times"]
  - id: r-008
    persona: finance
    query: What is the SPRING10 promotion?
    relevant: ["pricing-and-promotions@v1#Current and recent promotions"]
  - id: r-009
    persona: finance
    query: What are our gross margin targets by category?
    relevant: ["finance-margin-targets@v1#Targets by category"]
  - id: r-010
    persona: finance
    query: Walk me through the month-end close timeline.
    relevant: ["month-end-close@v1#Timeline"]
  - id: r-011
    persona: operations
    query: What are the delivery charges for web orders?
    relevant: ["shipping-and-delivery@v1#Delivery charges"]
  - id: r-012
    persona: finance
    query: How quickly must refunds be paid?
    relevant: ["returns-refund-policy@v2#Refund timing"]
  - id: r-013
    persona: operations
    query: How is average order value calculated?
    relevant: ["metric-definitions@v1#Orders and average order value"]

  # ------------------------------------------------ paraphrases (few shared keywords)
  - id: r-014
    persona: operations
    query: How long do customers have to send products back?
    relevant: ["returns-refund-policy@v2#Return window"]
  - id: r-015
    persona: operations
    query: how long can customers send stuff back
    relevant: ["returns-refund-policy@v2#Return window"]
  - id: r-016
    persona: operations
    query: Is shipping free if the basket is big enough?
    relevant: ["shipping-and-delivery@v1#Delivery charges"]
  - id: r-017
    persona: operations
    query: What time do the shops open on Sundays?
    relevant: ["store-operations-handbook@v1#Opening hours"]
  - id: r-018
    persona: operations
    query: Steps for taking back an item at the till
    relevant: ["store-operations-handbook@v1#Processing a return in store"]
  - id: r-019
    persona: operations
    query: Which item did we stop selling at the end of February?
    relevant: ["market-launches@v1#Range changes"]
  - id: r-020
    persona: operations
    query: How many weeks before a sofa order from the supplier arrives?
    relevant: ["inventory-replenishment@v1#Supplier lead times"]
  - id: r-021
    persona: operations
    query: How often is stock counted in stores?
    relevant: ["inventory-replenishment@v1#Cycle counts"]
  - id: r-022
    persona: operations
    query: Do we match prices from other retailers?
    relevant: ["pricing-and-promotions@v1#Price matching"]
  - id: r-023
    persona: operations
    query: Can someone keep half of the units they bought and return the rest?
    relevant: ["returns-refund-policy@v2#Partial returns"]

  # ------------------------------------------------ exact terms and codes
  - id: r-024
    persona: operations
    query: What does an invoice number starting with C mean?
    relevant: ["cancellation-policy@v1#How cancellations are recorded", "data-quality-notes@v1#Negative quantities"]
  - id: r-025
    persona: operations
    query: Is there a charge below €75?
    relevant: ["shipping-and-delivery@v1#Delivery charges"]
  - id: r-026
    persona: operations
    query: FR Online launch date
    relevant: ["market-launches@v1#France web shop launch"]
  - id: r-027
    persona: operations
    query: DEC-5001
    relevant: ["market-launches@v1#Range changes"]

  # ------------------------------------------------ answers spread over sections
  - id: r-028
    persona: operations
    query: Can a customer cancel after the order has shipped?
    relevant: ["cancellation-policy@v1#When customers can cancel", "shipping-and-delivery@v1#Dispatch cut-off"]
  - id: r-029
