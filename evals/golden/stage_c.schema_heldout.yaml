# Held-out schema-retrieval questions: Stage C. Synthetic.
#
# Written on 2026-11-27, BEFORE the schema retrieval step was built or measured on them. The
# retrieval design was chosen using stage_c.yaml (47 questions), so recall on that set is
# optimistic: these questions check it on wording it was never tuned on. They use everyday
# words rather than table or metric titles ("takings", "footfall", "folks who left").
#
# Each case names only the tables a correct plan must use. There are no expected numbers:
# this set scores table selection only, which needs no model and no answer key. Don't tune
# retrieval on it. If it is ever used for tuning, write a new held-out set and say so.
version: 1
dataset: stage_c

cases:
  - {id: h-01, persona: operations, tables: [transactions, returns], question: "What were our takings last month after refunds?"}
  - {id: h-02, persona: operations, tables: [transactions, returns, stores], question: "Which shop brought in the most money in April?"}
  - {id: h-03, persona: operations, tables: [transactions, products], question: "Which product sold the most units in Q1?"}
  - {id: h-04, persona: finance, tables: [transactions], question: "What share of orders got cancelled in February?"}
  - {id: h-05, persona: operations, tables: [returns, products], question: "Which categories have the most items sent back?"}
  - {id: h-06, persona: operations, tables: [shipments], question: "How long do parcels take to reach customers on average?"}
  - {id: h-07, persona: operations, tables: [inventory_snapshots, stores], question: "How many days were shops out of stock in March?"}
  - {id: h-08, persona: finance, tables: [purchase_orders, suppliers], question: "Which vendors deliver late most often?"}
  - {id: h-09, persona: operations, tables: [shifts, stores], question: "What is the sickness absence rate at each branch?"}
  - {id: h-10, persona: finance, tables: [sales_targets], question: "What was the sales goal for April?"}
  - {id: h-11, persona: operations, tables: [support_tickets], question: "How quickly do we reply to customer complaints?"}
  - {id: h-12, persona: operations, tables: [promotions], question: "How big is the average discount in our promotions?"}
